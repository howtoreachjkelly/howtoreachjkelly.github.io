<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — James Kelly</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  /* Projects-page-specific: grid needs extra bottom padding here that other pages using .grid don't need */
  #grid { padding-bottom: 3rem; grid-template-columns: 1fr; }
</style>
</head>
<body>

<div class="wrap">
  <nav class="site-nav">
    <a class="brand" href="index.html">James Kelly</a>
    <div class="links">
      <a href="about.html">About</a>
      <a href="ai-safety.html">AI safety</a>
      <a href="work.html">Experience</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="writing.html">Writing</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <header class="page-head">
    <h1>Projects &amp; passions</h1>
    <p>Self-directed builds and explorations, outside the day job.</p>
  </header>

  <div class="chips" id="chips">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="org">Organizational</button>
    <button class="chip" data-filter="operational">Operational</button>
    <button class="chip" data-filter="tech">Technical</button>
    <button class="chip" data-filter="media">Media</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" role="presentation">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="close-btn" id="closeBtn" aria-label="Close">&#10005;</button>
    <div class="tags" id="modalTags"></div>
    <h2 id="modal-title"></h2>
    <div class="media" id="modalMedia"></div>
    <p class="scs-label">Situation</p>
    <p class="scs-text" id="modalSituation"></p>
    <p class="scs-label">Challenge</p>
    <p class="scs-text" id="modalChallenge"></p>
    <p class="scs-label">Solution</p>
    <p class="scs-text" id="modalSolution"></p>
    <p id="modalLink" style="margin: 14px 0 0;"></p>
  </div>
</div>

<script>
// ---- Case study data ----
// "media" is a placeholder. Replace with: { type: "image", src: "/images/your-photo.jpg", alt: "..." }
// once real photos or diagrams are ready.
const TAG_LABELS = {
  org: "Organizational", operational: "Operational", tech: "Technical", media: "Media"
};

const CASE_STUDIES = [
  {
    slug: "ai-video-production-upskilling",
    title: "AI video production upskilling",
    tags: ["media"],
    summary: "A self-directed course built to figure out which AI-enabled video production tools are actually worth learning.",
    situation: "Need to learn the most AI-enabled, commonly used tools in video production to keep up with current practitioner knowledge.",
    challenge: "There are dozens of tools on the market, and no clear way to tell which are genuinely relevant versus a waste of time.",
    solution: "Worked with Claude to create a guided three-day course.",
    link: { url: "ai_video_course.html", label: "View the course" },
    media: { type: "image", src: "img/videocourse.png", alt: "Media library" }
  },
  {
    slug: "media-library",
    title: "Media library",
    tags: ["media"],
    summary: "Finding a cost-effective, user-friendly way to host years of music and video from produced and engineered performances.",
    situation: "Need somewhere to host all the music and video from every performance I've produced and engineered.",
    challenge: "A wide range of hosting options exist, but not all of them are cost-effective or user-friendly.",
    solution: "TBD.",
    links: [
      { url: "media-library-tutorial.html", label: "View the tutorial" },
      { url: "medialibrary/library.html", label: "View the live library" }
    ],
    media: { type: "image", src: "img/medialib.png", alt: "Media library" }
  },
  {
    slug: "airtable-hiring-workflow-tutorial",
    title: "Building an enterprise hiring workflow in Airtable",
    tags: ["org", "operational", "tech"],
    summary: "A full build manual for a requisition-to-offer hiring pipeline in Airtable \u2014 tables, automations, and a real approval chain, built without code.",
    situation: "Wanted to demonstrate building a real enterprise-grade hiring workflow using only no-code tools, not custom software.",
    challenge: "Most Airtable guides stop at a single table \u2014 there wasn't a clear walkthrough of a full multi-table system with automations and a genuine sequential approval chain.",
    solution: "Wrote a complete build manual covering all 8 tables, the automation logic, and the hardest part \u2014 a true multi-step approval chain \u2014 as a teaching artifact.",
    links: [{ url: "airtable-hiring-workflow-tutorial.html", label: "View the tutorial" }],
    media: { type: "image", src: "img/airtable_preview.png", alt: "Media library" }
  }
];

// ---- Render cards ----
const grid = document.getElementById("grid");
CASE_STUDIES.forEach(cs => {
  const card = document.createElement("button");
  card.className = "card";
  card.dataset.tags = cs.tags.join(" ");
  card.dataset.slug = cs.slug;
  card.innerHTML = `
    <div class="tags">${cs.tags.map(t => `<span class="tag" style="background:var(--tag-${t}-bg);color:var(--tag-${t}-text)">${TAG_LABELS[t]}</span>`).join("")}</div>
    <h3>${cs.title}</h3>
    <p>${cs.summary}</p>
  `;
  card.addEventListener("click", () => openCase(cs.slug, true));
  grid.appendChild(card);
});

// ---- Filtering ----
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    const f = chip.dataset.filter;
    document.querySelectorAll(".card").forEach(card => {
      const tags = card.dataset.tags.split(" ");
      card.style.display = (f === "all" || tags.includes(f)) ? "" : "none";
    });
  });
});

// ---- Modal + hash routing ----
const overlay = document.getElementById("overlay");
const modalTitle = document.getElementById("modal-title");
const modalTags = document.getElementById("modalTags");
const modalMedia = document.getElementById("modalMedia");
const modalSituation = document.getElementById("modalSituation");
const modalChallenge = document.getElementById("modalChallenge");
const modalSolution = document.getElementById("modalSolution");
const modalLink = document.getElementById("modalLink");
const closeBtn = document.getElementById("closeBtn");

function openCase(slug, pushHash) {
  const cs = CASE_STUDIES.find(c => c.slug === slug);
  if (!cs) return;
  modalTitle.textContent = cs.title;
  modalTags.innerHTML = cs.tags.map(t => `<span class="tag" style="background:var(--tag-${t}-bg);color:var(--tag-${t}-text)">${TAG_LABELS[t]}</span>`).join("");
  modalSituation.textContent = cs.situation;
  modalChallenge.textContent = cs.challenge;
  modalSolution.textContent = cs.solution;

  if (cs.links && cs.links.length) {
    modalLink.innerHTML = cs.links.map(l =>
      `<a href="${l.url}" target="_blank" rel="noopener" style="font-size:13px; color:var(--text-accent); text-decoration:underline; margin-right:16px;">${l.label}</a>`
    ).join("");
  } else if (cs.link) {
    modalLink.innerHTML = `<a href="${cs.link.url}" target="_blank" rel="noopener" style="font-size:13px; color:var(--text-accent); text-decoration:underline; margin-right:16px;">${cs.link.label}</a>`;
  } else {
    modalLink.innerHTML = "";
  }

  if (cs.media && cs.media.type === "image") {
    modalMedia.innerHTML = `<img src="${cs.media.src}" alt="${cs.media.alt || ""}">`;
  } else {
    modalMedia.innerHTML = `<i class="ti ti-photo" style="font-size:26px;" aria-hidden="true"></i><span>Photo or diagram placeholder</span>`;
  }

  overlay.classList.add("open");
  if (pushHash) {
    history.pushState({ slug }, "", `#${slug}`);
  }
}

function closeCase(clearHash) {
  overlay.classList.remove("open");
  if (clearHash && location.hash) {
    history.pushState({}, "", location.pathname + location.search);
  }
}

closeBtn.addEventListener("click", () => closeCase(true));
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCase(true); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && overlay.classList.contains("open")) closeCase(true); });
window.addEventListener("popstate", () => checkHash());

function checkHash() {
  const slug = location.hash.replace("#", "");
  if (slug && CASE_STUDIES.some(c => c.slug === slug)) {
    openCase(slug, false);
  } else {
    overlay.classList.remove("open");
  }
}

// Support direct links like projects.html#hatch-escapes on page load
checkHash();
</script>

</body>
</html>
