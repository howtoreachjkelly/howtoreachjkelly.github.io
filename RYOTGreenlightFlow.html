document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ine-height:0.94; letter-spacing:-0.02em; margin:0;\">Project Lifecycle<br>&amp; <span style=\"color:{{ accentColor }};\">Greenlight<\u002Fspan> Process<\u002Fh1>\n    <p style=\"font-size:40px; line-height:1.35; max-width:1180px; margin:48px 0 0; color:rgba(242,238,228,0.78); text-wrap:pretty;\">How an idea travels from intake to delivery — six phases, three standing weekly decision gates, and one source of truth.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:14px; align-items:center; font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,238,228,0.5);\">\n    <span>Submit<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span>Scope<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span>Review<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span>Terms<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span style=\"color:{{ accentColor }};\">Greenlight<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span>Execute<\u002Fspan><span style=\"color:{{ accentColor }};\">→<\u002Fspan><span>Complete<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2 · OVERVIEW MAP ═══════════════ -->\n<section data-label=\"At a Glance\" data-screen-label=\"Overview\" data-speaker-notes=\"The whole system on one page. Six numbered phases left to right. Three standing weekly meetings act as decision gates — Submission Review, Scoping Review, Final Review. Funding does not release until Full Greenlight, between Terms and Execution. Every gate has the same three exits: kill, block for more info, or advance.\" style=\"background:#16140F; color:#F2EEE4; font-family:'Space Grotesk',sans-serif; padding:84px 100px; display:flex; flex-direction:column; justify-content:space-between;\">\n  <div style=\"display:flex; justify-content:space-between; align-items:flex-end;\">\n    <div>\n      <div style=\"font-family:'Space Mono',monosp ter; font-size:38px; color:rgba(242,238,228,0.4);\">›<\u002Fdiv>\n    <!-- 06 -->\n    <div style=\"flex:1; border:1px solid rgba(242,238,228,0.16); border-radius:16px; padding:28px 24px; display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:30px; color:{{ accentColor }};\">06<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:34px; line-height:1.0;\">Complete<\u002Fdiv>\n      <div style=\"font-size:24px; color:rgba(242,238,228,0.62); line-height:1.3;\">Recap &amp; post-mortem<\u002Fdiv>\n      <div style=\"margin-top:auto; display:flex; align-items:center; gap:10px; font-family:'Space Mono',monospace; font-size:24px; color:rgba(242,238,228,0.85);\"><span style=\"width:13px; height:13px; border-radius:50%; border:3px solid {{ accentColor }};\"><\u002Fspan>Mtg 5<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:center; gap:36px;\">\n    <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(242,238,228,0.5);\">Every gate, three exits<\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"width:15px; height:15px; background:oklch(0.60 0.20 27); border-radius:3px;\"><\u002Fspan><span style=\"font-size:26px;\">Kill<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"width:15px; height:15px; background:oklch(0.76 0.15 75); border-radius:3px;\"><\u002Fspan><span style=\"font-size:26px;\">Block — more info<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"width:15px; height:15px; background:{{ accentColor }}; border-radius:3px;\"><\u002Fspan><span style=\"font-size:26px;\">Advance<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 2B · FULL PROCESS MAP ═══════════════ -->\n<section data-label=\" ;\">\n      <div style=\"min-height:128px; border:1px solid rgba(242,238,228,0.16); border-radius:14px; padding:20px;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:26px; color:{{ accentColor }};\">01<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:30px; line-height:1.0; margin-top:8px;\">Submission<\u002Fdiv>\n        <div style=\"font-size:24px; color:rgba(242,238,228,0.6); margin-top:8px;\">Intake &amp; strategic screen<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"min-height:96px; border:1px solid rgba(242,238,228,0.16); border-radius:14px; padding:16px 18px;\">\n        <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"width:14px; height:14px; border-radius:50%; border:3px solid {{ accentColor }}; flex:none;\"><\u002Fspan><span style=\"font-family:'Space Mono',monospace; font-size:24px;\">Mtg 1 · Submission Review<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:24px; color:rgba(242,238,228,0.55); margin-top:8px;\">Weekly · Mon &amp; Thu — Matrix analysis<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"display:flex; align-items:center; gap:11px; padding:11px 14px; border:1px solid rgba(242,238,228,0.14); border-radius:9px;\"><span style=\"width:13px; height:13px; background:oklch(0.60 0.20 27); border-radius:3px; flex:none;\"><\u002Fspan><span style=\"font-size:24px;\">Kill<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:11px; padding:11px 14px; border:1px solid rgba(242,238,228,0.14); border-radius:9px;\"><span style=\"width:13px; height:13px; background:oklch(0.76 0.15 75); border-radius:3px; flex:none;\"><\u002Fspan><span style=\"font-size:24px;\">Blocked — more info<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:11px; padding:11px 14px; background:{{ accentColor }}; border-radius:9px;\"><span style=\"wi percase; color:{{ accentColorDark }}; margin-bottom:16px;\">Phase 01 / 06<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:84px; line-height:0.96; letter-spacing:-0.02em; margin:0;\">Submission<\u002Fh2>\n        <p style=\"font-size:34px; line-height:1.35; margin:28px 0 0; color:rgba(22,20,15,0.7); text-wrap:pretty;\">One front door. Every idea enters as a JIRA submission and is screened twice a week for strategic and compliance fit.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:200px; line-height:0.8; color:rgba(22,20,15,0.06); letter-spacing:-0.04em;\">01<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:64px; align-items:flex-start;\">\n    <div style=\"flex:0 0 380px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(22,20,15,0.45); margin-bottom:24px;\">The work<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-size:30px; line-height:1.25;\">Submit the project in JIRA<\u002Fdiv>\n        <div style=\"font-size:30px; line-height:1.25;\">Reviewed weekly — Mondays &amp; Thursdays<\u002Fdiv>\n        <div style=\"font-size:30px; line-height:1.25;\">Logged to the project dashboard<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(22,20,15,0.45); margin-bottom:24px;\">The screen — matrix analysis<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:14px;\">\n        <div style=\"background:#fff; border:1px solid rgba(22,20,15,0.1); border-radius:12px; padding:22px 18px;\"><div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:28px; margin-bottom:8px;\ ,0.34);\">04<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:{{ accentColor }}; border-radius:3px;\"><\u002Fdiv><div style=\"display:flex; align-items:baseline; gap:14px;\"><span style=\"font-family:'Space Mono',monospace; font-size:24px;\">05<\u002Fspan><span style=\"font-weight:500; font-size:24px;\">Execution<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">06<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 9 · PHASE 06 COMPLETE ═══════════════ -->\n<section data-label=\"06 Complete\" data-screen-label=\"Phase 06\" data-speaker-notes=\"Delivery closes the loop. Status updates to complete, and an optional post-mortem captures production and finance recaps, an overall wins analysis, and updates the Wins Deck so the next project starts smarter.\" style=\"background:#F2EEE4; color:#16140F; font-family:'Space Grotesk',sans-serif; padding:84px 100px; display:flex; flex-direction:column; justify-content:space-between;\">\n  <div>\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\">\n      <div style=\"max-width:1180px;\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.2em; text-transform:uppercase; color:{{ accentColorDark }}; margin-bottom:16px;\">Phase 06 / 06<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:84px; line-height:0.96; letter-spacing:-0.02em; margin:0;\">Complete<\u002Fh2>\n        <p style=\"font-size:34px; line-height:1.35; margin:28px 0 0; color:rgba(22,20,15,0.7); text-wrap:pretty;\">Delivery closes the loop — and an optional post-mortem turns the project into a lesson for the next one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:200px; line-height:0.8; color:rgba(22,20,15,0.06); letter-spacing:-0.04em;\">06<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:64px; align-items:flex-start;\">\n    <div style=\"flex:0 0 360px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(22,20,15,0.45); margin-bottom:24px;\">Close out<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"font-size:30px; line-height:1.25;\">Update status &amp; notes<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:14px; padding:16px 22px; background:{{ accentColor }}; border-radius:10px; width:fit-content;\"><span style=\"width:14px; height:14px; background:#16140F; border-radius:3px;\"><\u002Fspan><span style=\"font-size:28px; font-weight:600; color:#16140F;\">Mark as Complete<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;\">\n      <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:24px;\"><span style=\"width:15px; height:15px; border-radius:50%; border:3px solid {{ accentColorDark }};\"><\u002Fspan><span style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.08em;\">MTG 5 · POST MORTEM<\u002Fspan><span style=\"font-size:24px; color:rgba(22,20,15,0.5);\">Optional<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:14px;\">\n        <div style=\"background:#fff; border:1px solid rgba(22,20,15,0.1); border-radius:12px; padding:22px 24px; font-size:30px;\">Production recap<\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid rgba(22,20,15,0.1); border-radius:12px; padding:22px 24px; font-size:30px;\">Finance recap<\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid rgba(22,20,15,0.1); border-radius:12px; padding:22px 24px; font-size:30px;\">Overall wins analysis<\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid rgba(22,20,15,0.1); border-radius:12px; padding:22px 24px; font-size:30px;\">Update the Wins Deck<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:18px; align-items:flex-end;\">\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">01<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">02<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">03<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">04<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:rgba(22,20,15,0.14); border-radius:3px;\"><\u002Fdiv><span style=\"font-family:'Space Mono',monospace; font-size:24px; color:rgba(22,20,15,0.34);\">05<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:11px;\"><div style=\"height:5px; background:{{ accentColor }}; border-radius:3px;\"><\u002Fdiv><div style=\"display:flex; align-items:baseline; gap:14px;\"><span style=\"font-family:'Space Mono',monospace; font-size:24px;\">06<\u002Fspan><span style=\"font-weight:500; font-size:24px;\">Complete<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ 10 · PRINCIPLES ═══════════════ -->\n<section data-label=\"By Design\" data-screen-label=\"Principles\" data-speaker-notes=\"Why the process holds. One front door means nothing skips intake. A weekly cadence keeps decisions from stalling. Every gate forces an explicit call. And money is the last thing to move — funding only releases at greenlight.\" style=\"background:#16140F; color:#F2EEE4; font-family:'Space Grotesk',sans-serif; padding:84px 100px; display:flex; flex-direction:column; justify-content:space-between;\">\n  <div>\n    <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.2em; text-transform:uppercase; color:{{ accentColor }}; margin-bottom:18px;\">Why it holds<\u002Fdiv>\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:72px; line-height:0.98; letter-spacing:-0.015em; margin:0;\">Four decisions, by design<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px;\">\n    <div style=\"border-top:4px solid {{ accentColor }}; padding-top:26px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:28px; color:{{ accentColor }}; margin-bottom:18px;\">01<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:38px; line-height:1.05; margin-bottom:16px;\">One front door<\u002Fdiv>\n      <div style=\"font-size:28px; line-height:1.35; color:rgba(242,238,228,0.68);\">Every project enters as a JIRA submission. Nothing skips intake.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:4px solid {{ accentColor }}; padding-top:26px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:28px; color:{{ accentColor }}; margin-bottom:18px;\">02<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:38px; line-height:1.05; margin-bottom:16px;\">Weekly cadence<\u002Fdiv>\n      <div style=\"font-size:28px; line-height:1.35; color:rgba(242,238,228,0.68);\">Standing review meetings keep decisions from stalling in a queue.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:4px solid {{ accentColor }}; padding-top:26px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:28px; color:{{ accentColor }}; margin-bottom:18px;\">03<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:38px; line-height:1.05; margin-bottom:16px;\">Explicit gates<\u002Fdiv>\n      <div style=\"font-size:28px; line-height:1.35; color:rgba(242,238,228,0.68);\">Nothing drifts forward. Each gate forces a call: kill, block, or advance.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:4px solid {{ accentColor }}; padding-top:26px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:28px; color:{{ accentColor }}; margin-bottom:18px;\">04<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:38px; line-height:1.05; margin-bottom:16px;\">Fund last<\u002Fdiv>\n      <div style=\"font-size:28px; line-height:1.35; color:rgba(242,238,228,0.68);\">Money is the last thing to move — funding releases only at greenlight.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'Space Mono',monospace; font-size:24px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,238,228,0.4);\">RYOT · Project Lifecycle &amp; Greenlight Process<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accentPalette&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;default&quot;: [&quot;#22b573&quot;, &quot;#2bd98a&quot;, &quot;#1a8c57&quot;],\n    &quot;tsType&quot;: &quot;string[]&quot;,\n    &quot;options&quot;: [\n      [&quot;#22b573&quot;, &quot;#2bd98a&quot;, &quot;#1a8c57&quot;],\n      [&quot;#2563eb&quot;, &quot;#60a5fa&quot;, &quot;#1e40af&quot;],\n      [&quot;#d97706&quot;, &quot;#fbbf24&quot;, &quot;#92400e&quot;]\n    ]\n  }\n}\">\nclass Component extends DCLogic {\n  hexToRgb(hex) {\n    const h = hex.replace('#', '');\n    const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;\n    const n = parseInt(full, 16);\n    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];\n  }\n  renderVals() {\n    const palette = this.props.accentPalette ?? ['#22b573', '#2bd98a', '#1a8c57'];\n    const [r, g, b] = this.hexToRgb(palette[0]);\n    return {\n      accentColor: palette[0],\n      accentColorBright: palette[1] ?? palette[0],\n      accentColorDark: palette[2] ?? palette[0],\n      accentColorFaint: 'rgba(' + r + ',' + g + ',' + b + ',0.12)',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
